# 修改 TNAME: JDCLOUD-RE-CP-02 中的型号为你需要编译的型号
# 注意名称要与 trunk/configs/templates/ 目录下的 .config 名字相同
name: Build Padavan

on: 
  release:
    types: [published]
  push:
    tags:
    - 'v*'
  watch:
    types: [started]
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击运行

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
        cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
        pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget

    - name: Clone source code
      run: |
        # 克隆 Padavan 源码到 /opt/rt-n56u
        git clone --depth=1 https://github.com/hanwckf/rt-n56u.git /opt/rt-n56u
        cd /opt/rt-n56u/toolchain-mipsel
        sh dl_toolchain.sh
        mkdir -p /opt/images/

    - name: Build Firmware
      env:
        TNAME: JDCLOUD-RE-CP-02
      run: |
        cd /opt/rt-n56u/trunk
        if [ ! -f configs/templates/$TNAME.config ] ; then
          echo "configs/templates/$TNAME.config not found!"
          exit 1
        fi
        cp -f configs/templates/$TNAME.config .config
        
        # 启用 HTTPS / OpenSSL 支持（按需）
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=n/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y/g' .config

        # 开始编译
        sudo ./build_firmware_modify $TNAME 0
        sudo mv -f images/*.trx /opt/images/ || sudo mv -f images/*.bin /opt/images/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Padavan-Firmware-${{ env.TNAME }}
        path: /opt/images/
